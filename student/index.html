<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Result Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Student Result Manager</h1>
    <p class="subtitle">Mini JavaScript Array Methods Project</p>

    <div class="controls">
      <button onclick="showAll()">All Students</button>
      <button onclick="showPassed()">Passed</button>
      <button onclick="showTopper()">Topper</button>
      <button onclick="sortStudents()">Sort by Marks</button>
      <button onclick="showUniqueSubjects()">Unique Subjects</button>
    </div>

    <div id="result" class="result"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
