<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Object Master - Mini Assessment</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Object Master</h1>
    <p>JavaScript Objects Mini Assessment</p>
  </header>

  <main>
    <section class="card">
      <h2>Student Profile</h2>
      <div id="profile"></div>
    </section>

    <section class="card">
      <h2>Statistics</h2>
      <div id="stats"></div>
    </section>

    <section class="card">
      <h2>Products</h2>
      <div id="products" class="grid"></div>
    </section>

    <section class="card">
      <h2>Object Inspector</h2>
      <p class="hint">The page also demonstrates Object.keys(), Object.values(), and Object.entries().</p>
      <pre id="inspector"></pre>
    </section>
  </main>

  <footer>
    <p>Built as a JavaScript mini assessment using object concepts.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
