<!DOCTYPE html>
<html>

<head>
    <title>Task Management Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>


<body>


<div class="container">


<header>

<h1>🚀 Task Management Dashboard</h1>

<p id="date"></p>

<button id="themeBtn">
🌙 Dark Mode
</button>

</header>



<section class="dashboard">


<div class="card">

<h3>Total Tasks</h3>
<p id="totalCount">0</p>

</div>


<div class="card">

<h3>Completed</h3>
<p id="completeCount">0</p>

</div>


<div class="card">

<h3>Pending</h3>
<p id="pendingCount">0</p>

</div>


</section>




<section class="form-section">


<h2>Add New Task</h2>


<input 
id="title"
placeholder="Task Title">


<textarea 
id="description"
placeholder="Task Description">
</textarea>



<select id="priority">

<option value="High">
High
</option>


<option value="Medium">
Medium
</option>


<option value="Low">
Low
</option>

</select>




<select id="category">

<option>
Work
</option>

<option>
Study
</option>


<option>
Personal
</option>


<option>
Fitness
</option>

</select>



<button id="addBtn">
Add Task
</button>



<p id="error"></p>


</section>





<section class="controls">


<input 
id="search"
placeholder="Search Task...">



<select id="filter">


<option value="all">
All
</option>


<option value="completed">
Completed
</option>


<option value="pending">
Pending
</option>


</select>



<select id="sort">


<option value="none">
Sort Priority
</option>


<option value="High">
High First
</option>


<option value="Medium">
Medium First
</option>


<option value="Low">
Low First
</option>


</select>


</section>






<section>

<h2>Your Tasks</h2>


<div id="taskContainer"></div>


</section>



</div>



<script src="script.js"></script>

</body>

</html>
